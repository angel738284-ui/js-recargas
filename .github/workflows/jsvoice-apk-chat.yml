name: JS VOICE 1.9 para ChatGPT
on:
  push:
    branches: [js-voice-deploy]
    paths: ['.github/workflows/jsvoice-apk-chat.yml']
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener APK oficial
        run: |
          curl --fail --location --retry 5 --output JS-VOICE-v1.9.0-Universal.apk 'https://github.com/angel738284-ui/js-voice-apk/releases/download/v1.9.0/JS-VOICE-v1.9.0-Universal.apk'
          test "$(stat -c%s JS-VOICE-v1.9.0-Universal.apk)" -eq 30145195
      - uses: actions/upload-artifact@v4
        with:
          name: JS-VOICE-v1.9-ChatGPT
          path: JS-VOICE-v1.9.0-Universal.apk
          retention-days: 7
